# Netlify detects Next.js and runs it with its Next.js runtime (pages, image CDN).
# The contact and application forms use Netlify Forms (definitions in public/__forms.html); no environment variables are needed.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Built scripts and styles have content hashes in their names, so browsers may keep them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
